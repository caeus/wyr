name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dagr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run dagr checks
        run: ./.dagr/dagr run //:ci:build //:ci:typecheck //:ci:docs
